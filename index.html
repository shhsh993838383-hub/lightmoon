    <script>
      try {
        const saved = localStorage.getItem('mujian-theme');
        const theme = saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
      } catch (_) {}
    </script>
